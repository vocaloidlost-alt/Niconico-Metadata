<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>削除動画メタデータ取得</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1d232b; --sub:#66707d; --line:#d5dae1; --card:#fff; --accent:#2457c5; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --fg:#e6e9ee; --sub:#98a2b0; --line:#2b333d; --card:#1b2027; --accent:#7ea6ff; --err:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 "Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  p.lead { margin:0 0 24px; color:var(--sub); font-size:.9rem; }
  label { display:block; font-size:.85rem; color:var(--sub); margin-bottom:4px; }
  input { width:100%; padding:10px 12px; font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; margin-bottom:14px; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { font:inherit; padding:10px 20px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#0d1420; } }
  button:disabled { opacity:.55; cursor:default; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); padding:6px 12px; font-size:.85rem; }
  #status { margin:20px 0 0; min-height:1.7em; color:var(--sub); font-size:.9rem; }
  #status.err { color:var(--err); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 20px; margin:20px 0 0; padding:16px 20px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  dt { color:var(--sub); }
  dd { margin:0; font-variant-numeric:tabular-nums; font-weight:700; }
  #fallback { margin-top:20px; padding:16px 20px; border:1px solid var(--line); border-radius:8px; background:var(--card); font-size:.9rem; }
  #fallback ol { padding-left:1.2em; margin:8px 0 12px; }
  textarea { width:100%; height:120px; font:12px/1.5 ui-monospace,Consolas,monospace; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>削除動画のメタデータ取得</h1>
  <p class="lead">動画を含む公開マイリストを1つ指定すると、その中から動画を探して再生数などを表示します。</p>

  <label for="ml">マイリストID</label>
  <input id="ml" inputmode="numeric" placeholder="77998989" autocomplete="off">
  <label for="vid">動画ID</label>
  <input id="vid" placeholder="sm45887462" autocomplete="off">
  <button id="go">取得する</button>

  <p id="status" role="status"></p>
  <dl id="result" hidden></dl>

  <section id="fallback" hidden>
    <strong>ブラウザに拒否されました(CORS)</strong>
    <p style="margin:6px 0 0">このHTMLを直接開いた状態では、ニコニコ側が通信を許可していないようです。代わりに次の手順で、同じ処理をニコニコのページ上で実行できます。</p>
    <ol>
      <li><a href="https://www.nicovideo.jp/" target="_blank" rel="noopener">nicovideo.jp</a> を開く</li>
      <li>F12 →「Console」タブを開く</li>
      <li>下のコードを貼り付けてEnter(貼り付けが警告されたら、画面の案内に従ってください)</li>
    </ol>
    <textarea id="snippet" readonly></textarea>
    <button class="ghost" id="copy" type="button">コードをコピー</button>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const HEADERS = { "X-Frontend-Id": "6", "X-Frontend-Version": "0" };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function snippetFor(ml, vid) {
  return '(async()=>{const H={"X-Frontend-Id":"6","X-Frontend-Version":"0"};' +
    'for(let p=1;;p++){const r=await fetch("https://nvapi.nicovideo.jp/v2/mylists/' + ml + '?pageSize=25&page="+p,{headers:H});' +
    'const it=(await r.json()).data.mylist.items;' +
    'if(!it.length){console.log("見つかりませんでした");return}' +
    'const f=it.find(i=>i.watchId==="' + vid + '");' +
    'if(f){console.log(f.status,f.video.registeredAt,f.video.count);return}' +
    'await new Promise(s=>setTimeout(s,1000))}})()';
}

async function fetchPage(ml, page, size) {
  return fetch("https://nvapi.nicovideo.jp/v2/mylists/" + encodeURIComponent(ml) +
    "?pageSize=" + size + "&page=" + page, { headers: HEADERS });
}

async function findVideo(ml, vid, onPage) {
  let size = 100, page = 1;
  for (;;) {
    onPage(page);
    let res = await fetchPage(ml, page, size);
    if (res.status === 400 && size !== 25) { size = 25; continue; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const items = (await res.json()).data.mylist.items;
    if (!items.length) return null;
    const hit = items.find(i => i.watchId === vid);
    if (hit) return hit;
    page++;
    await sleep(1000);
  }
}

function showResult(item) {
  const c = item.video.count, n = v => Number(v).toLocaleString("ja-JP");
  const rows = [
    ["動画ID", item.watchId], ["状態", item.status],
    ["投稿日", new Date(item.video.registeredAt).toLocaleString("ja-JP")],
    ["再生数", n(c.view)], ["コメント数", n(c.comment)],
    ["マイリスト数", n(c.mylist)], ["いいね数", n(c.like)]
  ];
  const dl = $("result");
  dl.replaceChildren();
  for (const [k, v] of rows) {
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k; dd.textContent = v;
    dl.append(dt, dd);
  }
  dl.hidden = false;
}

$("go").addEventListener("click", async () => {
  const ml = $("ml").value.trim(), vid = $("vid").value.trim();
  const st = $("status");
  st.className = ""; $("result").hidden = true; $("fallback").hidden = true;
  if (!/^\d+$/.test(ml) || !/^[a-z]{2}\d+$/i.test(vid)) {
    st.textContent = "マイリストIDは数字、動画IDは sm12345 の形式で入力してください。";
    st.className = "err"; return;
  }
  $("go").disabled = true;
  try {
    const item = await findVideo(ml, vid, p => st.textContent = p + "ページ目を確認中...");
    if (item) { st.textContent = "取得しました。"; showResult(item); }
    else { st.textContent = "このマイリストには動画が見つかりませんでした。"; st.className = "err"; }
  } catch (e) {
    if (e instanceof TypeError) {
      st.textContent = "取得できませんでした。"; st.className = "err";
      $("snippet").value = snippetFor(ml, vid);
      $("fallback").hidden = false;
    } else {
      st.textContent = "エラー: " + e.message; st.className = "err";
    }
  } finally { $("go").disabled = false; }
});

$("copy").addEventListener("click", async () => {
  const t = $("snippet"); t.select();
  try { await navigator.clipboard.writeText(t.value); $("copy").textContent = "コピーしました"; }
  catch { document.execCommand("copy"); }
});
</script>
</body>
</html>
